<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level 5 Leadership Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #EEECE7; --panel: #FAF9F6; --ink: #1F2A24; --muted: #7C7A72; --label: #3E4A43;
  --line: #E2DFD8; --gold: #B8963E; --gold-deep: #8C7232; --red: #9B2C2C; --green: #1F5C3A;
  --head-bg: #1C3A2B; --head-ink: #F4F1EA; --head-sub: #C9A84C; --head-muted: #93A89B;
  --tab-bg: #FAF9F6; --empty: #B5B2A9; --accent: #1C3A2B; --alert-ink: #8C6D1F;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121614; --panel: #1B211E; --ink: #EEEBE3; --muted: #A39F94; --label: #C9C4B8;
    --line: #2C3430; --gold: #C9A84C; --gold-deep: #B0924A; --red: #E08A7F; --green: #7FBF98;
    --head-bg: #10261B; --head-ink: #F4F1EA; --head-sub: #C9A84C; --head-muted: #7F9688;
    --tab-bg: #1B211E; --empty: #5D5A53; --accent: #5E9C7A; --alert-ink: #D4B45A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121614; --panel: #1B211E; --ink: #EEEBE3; --muted: #A39F94; --label: #C9C4B8;
  --line: #2C3430; --gold: #C9A84C; --gold-deep: #B0924A; --red: #E08A7F; --green: #7FBF98;
  --head-bg: #10261B; --head-ink: #F4F1EA; --head-sub: #C9A84C; --head-muted: #7F9688;
  --tab-bg: #1B211E; --empty: #5D5A53; --accent: #5E9C7A; --alert-ink: #D4B45A;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: Poppins, Arial, Helvetica, sans-serif; padding: 20px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.dashboard { max-width: 1100px; margin: 0 auto; }
.serif { font-family: "Playfair Display", Georgia, "Times New Roman", serif; }

/* HEADER */
.header { background: var(--head-bg); border-radius: 10px 10px 0 0; padding: 20px 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 9px; color: var(--head-muted); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 4px; }
.title { font-size: 24px; color: var(--head-ink); font-weight: 700; letter-spacing: 0.02em; }
.subtitle { font-size: 12px; color: var(--head-sub); margin-top: 3px; }
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.badge { background: #C9A84C; color: #1C3A2B; font-size: 10px; font-weight: 700; padding: 4px 12px; border-radius: 4px; letter-spacing: 0.1em; }
.last-updated { font-size: 9px; color: var(--head-muted); }

/* TABS */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--tab-bg); border-bottom: 2px solid var(--gold); display: flex; overflow-x: auto; }
.tab { flex: 1 0 auto; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 12px 18px; font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab .num { color: var(--gold-deep); margin-right: 6px; font-weight: 600; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }

/* ALERTS / NOTES */
.alert-bar { background: #8C6D1F; color: #FAF9F6; font-size: 9px; font-weight: 700; padding: 7px 20px; letter-spacing: 0.05em; }
.note-bar { background: var(--panel); color: var(--muted); font-size: 10px; padding: 9px 20px; border-bottom: 1px solid var(--line); font-style: italic; }

/* SECTION HEADERS */
.section-header { background: var(--bg); border-bottom: 2px solid var(--gold); padding: 7px 20px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-header span { font-size: 9px; font-weight: 700; color: var(--label); letter-spacing: 0.15em; text-transform: uppercase; }
.section-header .tag { font-weight: 500; color: var(--muted); letter-spacing: 0.08em; }

/* GRIDS */
.grid { background: var(--panel); display: grid; }
.g2 { grid-template-columns: repeat(2, 1fr); }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.cell { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.grid > .cell:last-child { border-right: none; }
.kpi-label { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 5px; }
.kpi-value { font-size: 19px; color: var(--ink); font-weight: 700; font-family: "Playfair Display", Georgia, serif; }
.kpi-value.red { color: var(--red); } .kpi-value.green { color: var(--green); }
.kpi-value.empty, .sub-value.empty { color: var(--empty); }
.kpi-sub { font-size: 9px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.sub-label { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; margin-top: 6px; margin-bottom: 2px; }
.sub-value { font-size: 14px; color: var(--ink); font-weight: 700; }

/* GRAND TOTAL */
.grand-total { background: #C9A84C; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.grand-total .label { font-size: 10px; font-weight: 700; color: #1C3A2B; letter-spacing: 0.1em; text-transform: uppercase; }
.grand-total .value { font-size: 24px; font-weight: 700; color: #10261B; font-family: "Playfair Display", Georgia, serif; }

/* CHARTS */
.chart-box { padding: 16px; }
.chart-title { font-size: 9px; color: var(--label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 12px; }
.chart-wrap { position: relative; height: 170px; }
.chart-empty { height: 170px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--empty); border: 1px dashed var(--line); border-radius: 6px; letter-spacing: 0.08em; text-transform: uppercase; }

/* 411 */
.pill { display: inline-block; background: #1C3A2B; color: #C9A84C; font-size: 8px; font-weight: 700; padding: 2px 8px; border-radius: 3px; letter-spacing: 0.1em; }
.goal { margin: 6px 0 10px; font-size: 11px; color: var(--muted); }
.goal strong { color: var(--ink); }
.row { display: flex; justify-content: space-between; gap: 10px; font-size: 10px; color: var(--muted); margin-bottom: 5px; }
.row b { color: var(--ink); white-space: nowrap; } .row b.red { color: var(--alert-ink); }
.bar { background: var(--line); height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
.bar > i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
.bar > i.red { background: #8C6D1F; }
.p1-split { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

/* LIST TABLE (recruiting) */
.mini { width: 100%; border-collapse: collapse; }
.mini td { font-size: 9px; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.mini tr:last-child td { border-bottom: none; }
.mini td.v { text-align: right; font-size: 11px; font-weight: 700; color: var(--ink); }
.mini td.v.green { color: var(--green); } .mini td.v.red { color: var(--red); } .mini td.v.empty { color: var(--empty); }
.mini .names { display: block; font-size: 9px; font-weight: 500; color: var(--muted); margin-top: 2px; }

.link-btn { background: none; border: none; font-family: inherit; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); cursor: pointer; border-bottom: 1px solid var(--gold); padding: 0 0 2px; }
.status { font-size: 9px; color: var(--muted); }
.status.live { color: var(--green); font-weight: 700; }

/* FOOTER */
.footer { background: var(--head-bg); padding: 12px 20px; border-radius: 0 0 10px 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.footer-left { font-size: 8px; color: var(--head-muted); font-style: italic; max-width: 560px; line-height: 1.5; }
.footer-right { font-size: 8px; color: var(--head-sub); }

/* MARKET CENTER COLORS */
:root { --mc1: #7A9A84; --mc2: #1C3A2B; --mc3: #B8963E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mc1: #9DBBA6; --mc2: #5E9C7A; --mc3: #C9A84C; } }
:root[data-theme="dark"] { --mc1: #9DBBA6; --mc2: #5E9C7A; --mc3: #C9A84C; }

/* SHARE STRIP (combined) */
.share-strip { background: var(--panel); padding: 14px 20px 12px; border-bottom: 1px solid var(--line); }
.share-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); margin-top: 6px; }
.share-bar > i { display: block; height: 100%; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 9px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: middle; }
.legend b { color: var(--ink); font-weight: 700; margin-left: 4px; }

/* COMPARISON TABLE */
.cmp-wrap { overflow-x: auto; background: var(--panel); }
table.cmp { width: 100%; border-collapse: collapse; min-width: 680px; }
.cmp th { font-size: 8px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--label); text-align: right; padding: 10px 14px; border-bottom: 2px solid var(--gold); background: var(--bg); font-weight: 700; white-space: nowrap; }
.cmp th:first-child, .cmp td:first-child { text-align: left; }
.cmp th .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: middle; }
.cmp td { padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--ink); text-align: right; vertical-align: top; }
.cmp td.metric { font-size: 10px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.cmp tr.grp td { background: var(--bg); font-size: 8px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--label); padding: 7px 14px; text-align: left; }
.cmp .val { font-weight: 700; white-space: nowrap; }
.cmp .val.empty { color: var(--empty); font-weight: 500; }
.cmp .lead { color: var(--gold-deep); font-size: 8px; margin-right: 4px; }
.cmp .mbar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.cmp .mbar > i { display: block; height: 100%; background: var(--c); }
.cmp .shr { font-size: 8px; color: var(--muted); margin-top: 3px; }
.cmp td.tot { background: var(--bg); }
.cmp-key { font-size: 9px; color: var(--muted); padding: 8px 20px; background: var(--panel); border-top: 1px solid var(--line); }

[hidden] { display: none !important; }

@media (max-width: 820px) {
  .g4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  body { padding: 10px; }
  .g2, .g3, .g4, .p1-split { grid-template-columns: 1fr; gap: 0; }
  .cell { border-right: none; }
  .header { padding: 16px 18px; }
  .header-right { align-items: flex-start; }
}
@media print {
  .tabs { position: static; }
  body::before { display: none; }
}
</style>
</head>
<body>
<div class="dashboard">

  <div class="header">
    <div>
      <div class="eyebrow">Keller Williams · Level 5 Leadership</div>
      <div class="title serif">Level 5 Leadership Dashboard</div>
      <div class="subtitle" id="hdr-subtitle"></div>
    </div>
    <div class="header-right">
      <div class="badge" id="hdr-badge">L5L</div>
      <div class="last-updated" id="hdr-updated"></div>
    </div>
  </div>

  <nav class="tabs" role="tablist" aria-label="Market centers" id="tabs"></nav>

  <main id="view"></main>

  <div class="footer">
    <div class="footer-left">To ignite a high-energy real estate revolution by fostering a welcoming community for agents; where a culture of productivity creates lives worth living.</div>
    <div class="footer-right" id="ftr-right"></div>
  </div>

</div>

<script>
/* ============================================================
   DATA — built-in fallback. Live numbers load from l5l-data.json.
   null = not yet reported (shows as “—”).
   ============================================================ */
let PERIOD = 'October 2026 · Week 4 (10/21–10/27)';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct'];

function emptyMC(id, name, code) {
  return {
    id, name, code, address: null, updated: null,
    income: { collectedCo: null, collectedBtf: null, collectedOtherOi: null, projectedCo: null, projectedBtf: null },
    production: { nextMo: null, listings: { units: null, vol: null }, written: { units: null, vol: null }, closed: { units: null, vol: null } },
    growth: { grossR1: null, grossR2: null, recruitedNames: null, offboarded: null, offboardedNames: null, net: null, count: null, countDate: null },
    recruiting: { r1Appts: null, r1Gross: null, r2Appts: null, r2Gross: null, added: null, addedNames: null, removed: null },
    p411: { p1: { agentsGoal: null, coGoal: null, agents: null, co: null }, p2: { agentsGoal: null, coGoal: null, agents: null, co: null }, p3: { text: null, unplugged: null } },
    trends: { co: null, units: null }
  };
}

let MCS = [
  emptyMC('weston', 'Weston', null),
  {
    id: 'pines', name: 'Pembroke Pines', code: 'MC587',
    address: '880 SW 145th Ave Suite 102 · Pembroke Pines, FL 33027 · 954.237.0400',
    updated: 'Oct 27, 2026 · 3:43 PM',
    income: { collectedCo: 32248.18, collectedBtf: 3600.00, collectedOtherOi: 6715.00, projectedCo: 20304.45, projectedBtf: 1500.00 },
    production: {
      nextMo: 8387.36,
      listings: { units: 32, vol: 18790199 },
      written:  { units: 49, vol: 13571287 },
      closed:   { units: 44, vol: 15019888 }
    },
    growth: {
      grossR1: 6, grossR2: 0, recruitedNames: 'Christian Moore Casso, Ruby Hernandez, Gorette Goncalves, Kevin Tenney, Bethany Tenney, Steven Nogradi',
      offboarded: 2, offboardedNames: 'Lucenda Roper, Yvesnola Joseph',
      net: 4, count: 171, countDate: 'As of Oct 27'
    },
    recruiting: { r1Appts: 12, r1Gross: 6, r2Appts: 1, r2Gross: 0, added: 6, addedNames: 'Moore Casso, Hernandez, Goncalves, K. Tenney, B. Tenney, Nogradi', removed: 2 },
    p411: {
      p1: { agentsGoal: 103, coGoal: 364120, agents: 48, co: 89000 },
      p2: { agentsGoal: 63, coGoal: 81092, agents: 53, co: 126077 },
      p3: { text: 'Tell our story through social media via agent interviews, classes & videography', unplugged: 18, viewership: 370 }
    },
    trends: {
      co:    [26621, 24430, 25133, 66019, 55031, 37234, 59866, 55101, 71170, 32248],
      units: [34, 52, 48, 44, 79, 54, 65, 60, 69, 44]
    }
  },
  emptyMC('miami-beach', 'Miami Beach', null)
];

/* ============================================================
   HELPERS
   ============================================================ */
const has = v => v !== null && v !== undefined;
const DASH = '—';
const money = (v, cents) => has(v) ? '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 }) : DASH;
const num = v => has(v) ? Number(v).toLocaleString('en-US') : DASH;
const signed = v => has(v) ? (v > 0 ? '+' + v : String(v)) : DASH;
const pct = (a, b) => (has(a) && has(b) && b) ? Math.round(a / b * 100) : null;
const cls = v => has(v) ? '' : ' empty';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function grandTotal(i) {
  if (!has(i.collectedCo)) return null;
  return [i.collectedCo, i.collectedBtf, i.collectedOtherOi, i.projectedCo, i.projectedBtf].filter(has).reduce((a, b) => a + b, 0);
}
const reporting = mc => has(mc.income.collectedCo);

/* ============================================================
   L5L COMBINED + COMPARISON
   ============================================================ */
const MC_COLOR = ['--mc1', '--mc2', '--mc3'];
const mcColorVar = mc => MC_COLOR[MCS.indexOf(mc) % MC_COLOR.length];

function sumArrays(arrs) {
  const a = arrs.filter(Array.isArray);
  if (!a.length) return null;
  return MONTHS.map((_, i) => a.reduce((s, x) => s + (Number(x[i]) || 0), 0));
}

function combined() {
  const live = MCS.filter(reporting);
  const S = get => { const v = live.map(get).filter(has); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
  return {
    id: 'l5l', name: 'Level 5 Leadership', live,
    income: {
      collectedCo: S(m => m.income.collectedCo), collectedBtf: S(m => m.income.collectedBtf),
      collectedOtherOi: S(m => m.income.collectedOtherOi), projectedCo: S(m => m.income.projectedCo),
      projectedBtf: S(m => m.income.projectedBtf)
    },
    production: {
      nextMo: S(m => m.production.nextMo),
      listings: { units: S(m => m.production.listings.units), vol: S(m => m.production.listings.vol) },
      written:  { units: S(m => m.production.written.units),  vol: S(m => m.production.written.vol) },
      closed:   { units: S(m => m.production.closed.units),   vol: S(m => m.production.closed.vol) }
    },
    growth: {
      grossR1: S(m => m.growth.grossR1), grossR2: S(m => m.growth.grossR2),
      offboarded: S(m => m.growth.offboarded), net: S(m => m.growth.net), count: S(m => m.growth.count)
    },
    trends: { co: sumArrays(live.map(m => m.trends.co)), units: sumArrays(live.map(m => m.trends.units)) }
  };
}

const div = (a, b) => (has(a) && has(b) && b) ? a / b : null;
const grossOf = m => (has(m.growth.grossR1) || has(m.growth.grossR2)) ? (m.growth.grossR1 || 0) + (m.growth.grossR2 || 0) : null;
const revPerAgent = m => div(grandTotal(m.income), m.growth.count);
const unitsPerAgent = m => div(m.production.closed.units, m.growth.count);
const avgClosed = m => div(m.production.closed.vol, m.production.closed.units);
const netPct = m => { const v = div(m.growth.net, m.growth.count); return has(v) ? v * 100 : null; };

function fmtV(type, v) {
  if (!has(v)) return DASH;
  switch (type) {
    case 'm2': return money(v, true);
    case 'm0': return money(v);
    case 's':  return signed(v);
    case 'p':  return (v > 0 ? '+' : '') + v.toFixed(1) + '%';
    case 'd2': return v.toFixed(2);
    default:   return num(Math.round(v * 100) / 100);
  }
}

const kpi = (label, v, type, sub, extra) => `
  <div class="cell"><div class="kpi-label">${label}</div><div class="kpi-value${cls(v)}${extra || ''}">${fmtV(type, v)}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
const prodCellT = (label, o) => `
  <div class="cell">
    <div class="kpi-label">${label}</div>
    <div class="sub-label">Units</div><div class="sub-value${cls(o.units)}">${fmtV('n', o.units)}</div>
    <div class="sub-label">Sales Volume</div><div class="sub-value${cls(o.vol)}">${money(o.vol)}</div>
  </div>`;

function renderCombined() {
  const c = combined(), i = c.income, p = c.production, g = c.growth;
  const gt = grandTotal(i);
  const liveNames = c.live.map(m => m.name).join(', ') || 'none yet';
  const shares = MCS.map(m => ({ m, v: reporting(m) ? grandTotal(m.income) : null }));
  const shareStrip = has(gt) && gt > 0 ? `
    <div class="share-strip">
      <div class="kpi-label">Share of Grand Total Projected Revenue</div>
      <div class="share-bar">${shares.filter(s => has(s.v) && s.v > 0).map(s => `<i style="width:${(s.v / gt * 100).toFixed(2)}%;background:var(${mcColorVar(s.m)})" title="${esc(s.m.name)}"></i>`).join('')}</div>
      <div class="legend">${shares.map(s => `<span style="--c:var(${mcColorVar(s.m)})">${esc(s.m.name)}<b>${has(s.v) ? Math.round(s.v / gt * 100) + '%' : DASH}</b></span>`).join('')}</div>
    </div>` : '';

  return `
    <div class="note-bar">Company-wide totals for ${esc(PERIOD)}. Includes ${c.live.length} of ${MCS.length} market centers reporting (${esc(liveNames)}); centers without reports are added automatically once their numbers are loaded.</div>

    <div class="section-header"><span>Income</span><span class="tag">All market centers</span></div>
    <div class="grid g3">
      ${kpi('Collected Co$', i.collectedCo, 'm2', 'Income Statements · Current Actual')}
      ${kpi('Collected BTF (Admin Fees)', i.collectedBtf, 'm2', 'Acct 8-0040 · Current Actual')}
      ${kpi('Collected Other OI', i.collectedOtherOi, 'm2', 'Total OI minus BTF')}
    </div>

function renderCompare() {
  const c = combined();
  const live = MCS.filter(reporting).length;
  const head = `<tr><th>Metric</th>${MCS.map(m => `<th><span class="sw" style="--c:var(${mcColorVar(m)})"></span>${esc(m.name)}</th>`).join('')}<th>L5L Total</th></tr>`;
  const rows = CMP_METRICS.map(d => {
    if (d.grp) return `<tr class="grp"><td colspan="${MCS.length + 2}">${d.grp}</td></tr>`;
    const vals = MCS.map(m => reporting(m) ? d.get(m) : null);
    const total = d.get(c);
    const present = vals.filter(has);
    const max = Math.max(0, ...present.map(Math.abs));
    let leadIdx = -1;
    if (present.length > 1) {
      const best = d.low ? Math.min(...present) : Math.max(...present);
      leadIdx = vals.findIndex(v => v === best);
    }
    const cells = vals.map((v, idx) => {
      const pctOfTotal = d.share && has(v) && has(total) && total ? Math.round(v / total * 100) : null;
      return `<td>
        <div class="val${has(v) ? '' : ' empty'}">${idx === leadIdx ? '<span class="lead" title="Leader">●</span>' : ''}${fmtV(d.t, v)}</div>
        ${has(v) && max > 0 ? `<div class="mbar" style="--c:var(${mcColorVar(MCS[idx])})"><i style="width:${Math.max(0, v) / max * 100}%"></i></div>` : ''}
        ${has(pctOfTotal) ? `<div class="shr">${pctOfTotal}% of L5L</div>` : ''}
      </td>`;
    }).join('');
    return `<tr><td class="metric">${d.label}</td>${cells}<td class="tot"><div class="val${has(total) ? '' : ' empty'}">${fmtV(d.t, total)}</div></td></tr>`;
  }).join('');

  return `
    <div class="note-bar">Side-by-side comparison of each market center for ${esc(PERIOD)}. ${live} of ${MCS.length} market centers reporting.</div>
    <div class="section-header"><span>Market Center Comparison</span><span class="tag">Income · Production · Growth · Efficiency</span></div>
    <div class="cmp-wrap"><table class="cmp"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <div class="cmp-key"><span style="color:var(--gold-deep)">●</span> marks the leading market center on each metric (lowest for Agents Offboarded) once two or more centers are reporting. Bars compare centers against each other; “% of L5L” is each center’s share of the company total.</div>

    <div class="section-header"><span>Collected Co$ Trend</span><span class="tag">2026 YTD by market center</span></div>
    <div class="grid" style="grid-template-columns:1fr;">
      <div class="cell chart-box" style="border-right:none;">${MCS.some(m => reporting(m) && m.trends.co) ? `<div class="chart-wrap" style="height:220px;"><canvas id="co-compare"></canvas></div>` : `<div class="chart-empty">No trend data yet</div>`}</div>
    </div>
    <div class="grid" style="grid-template-columns:1fr;">
      ${MCS.map(m => `<div class="cell" style="border-right:none;display:flex;justify-content:space-between;align-items:center;gap:8px;"><span class="status${reporting(m) ? ' live' : ''}">${reporting(m) ? '● ' + esc(m.name) + ' reporting' + (m.updated ? ' · ' + esc(m.updated) : '') : esc(m.name) + ' · awaiting data'}</span><button class="link-btn" data-go="${m.id}">Open ${esc(m.name)} →</button></div>`).join('')}
    </div>`;
}

/* ============================================================
   CHARTS
   ============================================================ */
let charts = [];
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawCharts(mc) {
  charts.forEach(c => c.destroy()); charts = [];
  if (!window.Chart) return;
  const ink = cssVar('--accent'), muted = cssVar('--muted'), line = cssVar('--line'), gold = cssVar('--gold');
  const last = MONTHS.length - 1;
  const axes = (fmt) => ({
    y: { ticks: { callback: fmt || (v => v), color: muted, font: { size: 9 } }, grid: { color: line } },
    x: { ticks: { color: muted, font: { size: 9 } }, grid: { display: false } }
  });
  const base = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } };
  const coEl = document.getElementById('co-' + mc.id);
  if (coEl) charts.push(new Chart(coEl, {
    type: 'bar',
    data: { labels: MONTHS, datasets: [{ data: mc.trends.co, backgroundColor: mc.trends.co.map((v, i) => i === last ? gold : ink), borderRadius: 4 }] },
    options: { ...base, plugins: { ...base.plugins, tooltip: { callbacks: { label: c => money(c.raw) } } }, scales: axes(v => '$' + (v / 1000).toFixed(0) + 'k') }
  }));
  const uEl = document.getElementById('units-' + mc.id);
  if (uEl) charts.push(new Chart(uEl, {
    type: 'line',
    data: { labels: MONTHS, datasets: [{ data: mc.trends.units, borderColor: ink, backgroundColor: 'rgba(201,168,76,0.15)', pointBackgroundColor: mc.trends.units.map((v, i) => i === last ? gold : ink), pointRadius: 5, fill: true, tension: 0.3 }] },
    options: { ...base, scales: axes() }
  }));
}

function chartBase() {
  const muted = cssVar('--muted'), line = cssVar('--line');
  return {
    muted, line,
    axes: (fmt, stacked) => ({
      y: { stacked: !!stacked, ticks: { callback: fmt || (v => v), color: muted, font: { size: 9 } }, grid: { color: line } },
      x: { stacked: !!stacked, ticks: { color: muted, font: { size: 9 } }, grid: { display: false } }
    })
  };
}
const legendOpts = () => ({ display: true, position: 'bottom', labels: { boxWidth: 8, boxHeight: 8, font: { size: 9 }, color: cssVar('--muted') } });
const kFmt = v => '$' + (v / 1000).toFixed(0) + 'k';

function drawCombinedCharts() {
  charts.forEach(c => c.destroy()); charts = [];
  if (!window.Chart) return;
  const { axes } = chartBase();
  const live = MCS.filter(m => reporting(m));
  const ds = key => live.filter(m => Array.isArray(m.trends[key])).map(m => ({ label: m.name, data: m.trends[key], backgroundColor: cssVar(mcColorVar(m)), borderRadius: 3 }));
  const opts = (fmt, money_) => ({ responsive: true, maintainAspectRatio: false, plugins: { legend: legendOpts(), tooltip: { callbacks: { label: c => c.dataset.label + ': ' + (money_ ? money(c.raw) : c.raw) } } }, scales: axes(fmt, true) });
  const coEl = document.getElementById('co-l5l');
  if (coEl) charts.push(new Chart(coEl, { type: 'bar', data: { labels: MONTHS, datasets: ds('co') }, options: opts(kFmt, true) }));
  const uEl = document.getElementById('units-l5l');
  if (uEl) charts.push(new Chart(uEl, { type: 'bar', data: { labels: MONTHS, datasets: ds('units') }, options: opts(null, false) }));
}

function drawCompareChart() {
  charts.forEach(c => c.destroy()); charts = [];
  if (!window.Chart) return;
  const { axes } = chartBase();
  const el = document.getElementById('co-compare');
  if (!el) return;
  const datasets = MCS.filter(m => reporting(m) && Array.isArray(m.trends.co)).map(m => {
    const col = cssVar(mcColorVar(m));
    return { label: m.name, data: m.trends.co, borderColor: col, backgroundColor: col, pointRadius: 3, tension: 0.3, fill: false };
  });
  charts.push(new Chart(el, { type: 'line', data: { labels: MONTHS, datasets }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: legendOpts(), tooltip: { callbacks: { label: c => c.dataset.label + ': ' + money(c.raw) } } }, scales: axes(kFmt) } }));
}

let TABS = [];
const tabsEl = document.getElementById('tabs');
function buildTabs() {
  TABS = [{ id: 'l5l', label: 'L5L Combined' }, { id: 'compare', label: 'Comparison' }, ...MCS.map(m => ({ id: m.id, label: m.name }))];

let current = null;
function show(id) {
  if (id === 'overview') id = 'compare';
  if (!TABS.some(t => t.id === id)) id = 'l5l';
  current = id;
  tabsEl.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
  const view = document.getElementById('view');
  const mc = MCS.find(m => m.id === id);
  if (mc) {
    view.innerHTML = renderMC(mc);
    document.getElementById('hdr-subtitle').textContent = mc.name + '  ·  ' + PERIOD;
    document.getElementById('hdr-badge').textContent = mc.code || mc.name.toUpperCase();
    document.getElementById('hdr-updated').textContent = mc.updated ? 'Last updated: ' + mc.updated : 'Awaiting first update';
    document.getElementById('ftr-right').textContent = mc.address || 'Level 5 Leadership · South Florida';
    drawCharts(mc);
  } else {
    const isL5L = id === 'l5l';
    view.innerHTML = isL5L ? renderCombined() : renderCompare();
    document.getElementById('hdr-subtitle').textContent = (isL5L ? 'Company Totals' : 'Market Center Comparison') + '  ·  ' + PERIOD;
    document.getElementById('hdr-badge').textContent = 'L5L';
    const latest = MCS.filter(m => m.updated).map(m => m.updated)[0];
    document.getElementById('hdr-updated').textContent = latest ? 'Last updated: ' + latest : '';
    document.getElementById('ftr-right').textContent = 'Level 5 Leadership · Weston · Pembroke Pines · Miami Beach';
    if (isL5L) drawCombinedCharts(); else drawCompareChart();
  }
  try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); } catch (e) {}
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab], [data-go]');
  if (!t) return;
  show(t.dataset.tab || t.dataset.go);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
tabsEl.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = TABS.findIndex(t => t.id === current);
  const n = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length].id;
  show(n); tabsEl.querySelector(`[data-tab="${n}"]`).focus();
});
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
try {
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (current) show(current); });
} catch (e) {}

/* Load live numbers from l5l-data.json (same folder). Falls back to the
   numbers built into this page if the file is missing or invalid. */
function start() { buildTabs(); show(location.hash.slice(1) || 'l5l'); }
fetch('l5l-data.json?v=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    if (d && Array.isArray(d.marketCenters) && d.marketCenters.length) {
      MCS = d.marketCenters.map(m => Object.assign(emptyMC(m.id, m.name, m.code || null), m));
      if (d.months) MONTHS.splice(0, MONTHS.length, ...d.months);
      if (d.period) PERIOD = d.period;
    }
  })
  .catch(err => console.warn('Using built-in data:', err))
  .finally(start);
</script>
</body>
</html>
